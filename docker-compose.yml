services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "5000"
      HISTORICAL_DATA_ROOT: /app/backend/data/processed
      FAIL_ON_DATA_LOAD_ERROR: "true"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:5000/api/health')); raise SystemExit(0 if data.get('status') == 'ok' else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped
